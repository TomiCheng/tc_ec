[package]
name = "tc_ec_key"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Elliptic-curve keys after Bouncy Castle: private and public keys and the key-pair generator, over any tc_ec_core curve."
readme = "README.md"
documentation = "https://docs.rs/tc_ec_key"
keywords = ["elliptic-curve", "ecc", "keys", "cryptography", "no-std"]
categories = ["cryptography", "no-std"]
include = ["src/**", "tests/**", "README.md", "CHANGELOG.md", "LICENSE-MIT", "LICENSE-APACHE"]

[dependencies]
rand_core = { version = "0.10.1", default-features = false }
tc_asym_cipher = "0.2.0"
tc_bigint = { version = "0.1.0", features = ["alloc", "rand_core"] }
tc_ec_core = "0.1.0"
tc_zeroize = "0.1.0"

[dev-dependencies]
rand = "0.10.3"
tc_f2m_curve = "0.1.0"
tc_fp_curve = "0.1.0"
